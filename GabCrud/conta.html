<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minha conta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- =========================
             MINHA CONTA
        ========================== -->

        <section
            id="accountPage"
            class="page"
        >

            <div class="card">

                <h1>Minha conta</h1>

                <div class="account-info">

                    <p>
                        <strong>Nome:</strong>
                        <span id="accountName"></span>
                    </p>

                    <p>
                        <strong>E-mail:</strong>
                        <span id="accountEmail"></span>
                    </p>

                    <p>
                        <strong>Data de nascimento:</strong>
                        <span id="accountBirthDate"></span>
                    </p>

                </div>


                <button
                    type="button"
                    onclick="showEditPage()"
                >
                    Editar conta
                </button>


                <button
                    type="button"
                    class="delete-button"
                    onclick="deleteAccount()"
                >
                    Excluir conta
                </button>


                <button
                    type="button"
                    class="link-button"
                    onclick="logout()"
                >
                    Sair
                </button>

            </div>

        </section>


        <!-- =========================
             EDITAR CONTA
        ========================== -->

        <section
            id="editPage"
            class="page hidden"
        >

            <div class="card">

                <h1>Editar conta</h1>

                <p class="subtitle">
                    Altere seus dados
                </p>

                <form id="editForm">

                    <!-- NOME -->

                    <label for="editName">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="editName"
                        required
                    >


                    <!-- E-MAIL -->

                    <label for="editEmail">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="editEmail"
                        required
                    >


                    <!-- SENHA -->

                    <label for="editPassword">
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="editPassword"
                        placeholder="Digite uma nova senha"
                        required
                    >


                    <!-- DATA -->

                    <label for="editBirthDate">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="editBirthDate"
                        required
                    >


                    <button type="submit">
                        Salvar alterações
                    </button>

                </form>

                <p
                    id="editMessage"
                    class="message"
                ></p>


                <button
                    type="button"
                    class="link-button"
                    onclick="showAccountPage()"
                >
                    Cancelar
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
