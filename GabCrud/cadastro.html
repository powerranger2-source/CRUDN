<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="page">

            <div class="card">

                <h1>Criar conta</h1>

                <p class="subtitle">
                    Cadastre seus dados
                </p>

                <form id="registerForm">

                    <!-- NOME -->

                    <label for="name">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Digite seu nome"
                        required
                    >


                    <!-- E-MAIL -->

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >


                    <!-- SENHA -->

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >


                    <!-- CONFIRMAR SENHA -->

                    <label for="confirmPassword">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Digite a senha novamente"
                        required
                    >


                    <!-- DATA DE NASCIMENTO -->

                    <label for="birthDate">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="birthDate"
                        name="birthDate"
                        required
                    >


                    <!-- BOTÃO -->

                    <button type="submit">
                        Criar conta
                    </button>

                </form>

                <p
                    id="registerMessage"
                    class="message"
                ></p>


                <button
                    type="button"
                    class="link-button"
                    onclick="window.location.href='index.html'"
                >
                    Voltar para o login
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
